<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>True-Cost EMI & 0% Financing Trap Calculator</title>
<style>
  :root { --bg: #0b0f19; --card: #131a2a; --text: #f1f5f9; --muted: #94a3b8; --green: #10b981; --red: #ef4444; --accent: #3b82f6; }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { background: var(--bg); color: var(--text); margin: 0; padding: 24px; display: flex; justify-content: center; }
  .wrap { max-width: 680px; width: 100%; background: var(--card); border: 1px solid #1e293b; border-radius: 16px; padding: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  h1 { font-size: 1.35rem; margin: 0; }
  .toggle button { background: #1e293b; color: var(--muted); border: 1px solid #334155; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .toggle button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; }
  input { width: 100%; background: #0b0f19; border: 1px solid #334155; color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 1rem; }
  .results { margin-top: 24px; background: #0b0f19; border-radius: 12px; padding: 20px; border: 1px solid #1e293b; }
  .row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.95rem; }
  .bars { margin-top: 18px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; }
  .track { background: #1e293b; height: 22px; border-radius: 6px; overflow: hidden; margin-bottom: 14px; }
  .fill-green { background: var(--green); height: 100%; transition: width 0.3s; }
  .fill-red { background: var(--red); height: 100%; transition: width 0.3s; }
  .verdict { margin-top: 16px; padding: 14px; border-radius: 10px; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; font-weight: 600; text-align: center; font-size: 1.05rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>True-Cost "0% EMI" Trap Scanner</h1>
    <div class="toggle">
      <button id="btnINR" class="active" onclick="setCurr('INR')">₹ INR</button>
      <button id="btnUSD" onclick="setCurr('USD')">$ USD</button>
    </div>
  </div>

  <div class="grid">
    <div><label>Listed Product Price</label><input type="number" id="price" value="50000" oninput="calc()"></div>
    <div><label>Tenure (Months)</label><input type="number" id="months" value="12" oninput="calc()"></div>
    <div><label>Hidden Bank Interest (% APR)</label><input type="number" id="rate" value="16" oninput="calc()"></div>
    <div><label>Processing / Origination Fee</label><input type="number" id="fee" value="499" oninput="calc()"></div>
    <div><label>Tax / GST on Interest & Fee (%)</label><input type="number" id="tax" value="18" oninput="calc()"></div>
    <div><label>Lost Upfront Cash Discount</label><input type="number" id="disc" value="2500" oninput="calc()"></div>
  </div>

  <div class="results">
    <div class="row"><span>Hidden Bank Interest (Subvention):</span><strong id="outInt">₹0</strong></div>
    <div class="row"><span>Extra Tax / GST Paid by You:</span><strong id="outTax">₹0</strong></div>
    <div class="row"><span>Processing Fee + Lost Cash Discount:</span><strong id="outExtra">₹0</strong></div>

    <div class="bars">
      <div class="bar-label"><span>True Upfront Cash Price</span><strong id="lblCash" style="color:var(--green)">₹0</strong></div>
      <div class="track"><div id="barCash" class="fill-green" style="width:80%"></div></div>

      <div class="bar-label"><span>Actual "0% EMI" Total Paid</span><strong id="lblEmi" style="color:var(--red)">₹0</strong></div>
      <div class="track"><div id="barEmi" class="fill-red" style="width:100%"></div></div>
    </div>

    <div class="verdict" id="verdict">Hidden Loss: ₹0</div>
  </div>
</div>

<script>
let sym = '₹';
function setCurr(c) {
  sym = c === 'INR' ? '₹' : '$';
  document.getElementById('btnINR').classList.toggle('active', c === 'INR');
  document.getElementById('btnUSD').classList.toggle('active', c === 'USD');
  if (c === 'USD') {
    price.value = 1000; rate.value = 15; fee.value = 25; tax.value = 10; disc.value = 60;
  } else {
    price.value = 50000; rate.value = 16; fee.value = 499; tax.value = 18; disc.value = 2500;
  }
  calc();
}
function calc() {
  const P = +price.value || 0, n = +months.value || 1, r = (+rate.value || 0) / 1200;
  const f = +fee.value || 0, t = (+tax.value || 0) / 100, d = +disc.value || 0;
  const emi = r > 0 ? (P * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1) : P / n;
  const interest = Math.max(0, (emi * n) - P);
  const taxPaid = (interest + f) * t;
  const cashPrice = Math.max(0, P - d);
  const trueEmiTotal = P + f + taxPaid;
  const loss = trueEmiTotal - cashPrice;

  outInt.textContent = sym + Math.round(interest).toLocaleString();
  outTax.textContent = sym + Math.round(taxPaid).toLocaleString();
  outExtra.textContent = sym + Math.round(f + d).toLocaleString();
  lblCash.textContent = sym + Math.round(cashPrice).toLocaleString();
  lblEmi.textContent = sym + Math.round(trueEmiTotal).toLocaleString();

  const maxVal = Math.max(cashPrice, trueEmiTotal, 1);
  barCash.style.width = ((cashPrice / maxVal) * 100) + '%';
  barEmi.style.width = ((trueEmiTotal / maxVal) * 100) + '%';
  verdict.textContent = `Hidden Loss on "0% Financing": ${sym}${Math.round(loss).toLocaleString()}`;
}
calc();
</script>
</body>
</html>
