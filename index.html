<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Janvi 💗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <style>
:root {
  --bg-midnight: #120826;
  --bg-violet: #2b124c;
  --bg-deep: #1b0b36;
  --lavender: #c4a7ff;
  --blush: #ff8fb8;
  --gold: #ffd479;
  --white: #fff8ff;
  --muted: #d9c8f5;
  --glass-bg: rgba(34, 15, 66, 0.58);
  --glass-border: rgba(255, 248, 255, 0.16);
  --glass-shadow: 0 20px 50px rgba(7, 2, 18, 0.55);
  --font-display: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
  --font-sans: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
  --font-hand: 'Caveat', 'Dancing Script', cursive, Georgia, serif;
  --radius-lg: 24px;
  --radius-md: 16px;
}

*, *::before, *::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  background: var(--bg-midnight);
  color: var(--white);
  font-family: var(--font-sans);
  overflow-x: hidden;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at 20% 10%, #2b124c 0%, #120826 55%, #0a0417 100%);
  color: var(--white);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Background 3D Canvas */
#universe-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* Floating Ambient Hearts & Petals */
#ambient-layer {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

.ambient-floater {
  position: absolute;
  bottom: -40px;
  opacity: 0.45;
  animation: floatUpSlow linear infinite;
  user-select: none;
}

@keyframes floatUpSlow {
  0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
  15% { opacity: 0.5; }
  85% { opacity: 0.45; }
  100% { transform: translateY(-115vh) rotate(360deg) scale(1.1); opacity: 0; }
}

/* Top Glass Navbar */
.top-nav {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: min(96%, 1180px);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 18px;
  border-radius: 999px;
  background: rgba(20, 8, 43, 0.72);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 2px solid rgba(255, 194, 226, 0.35);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}

.brand-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--white);
  text-decoration: none;
  white-space: nowrap;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 6px;
  list-style: none;
  margin: 0;
  padding: 0;
}

.nav-links a {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.84rem;
  font-weight: 500;
  padding: 6px 10px;
  border-radius: 999px;
  transition: color 0.2s, background 0.2s;
  white-space: nowrap;
}

.nav-links a:hover, .nav-links a:focus-visible {
  color: var(--white);
  background: rgba(255, 143, 184, 0.18);
  outline: none;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 13px;
  border-radius: 999px;
  border: 2px solid rgba(255, 194, 226, 0.35);
  background: rgba(255, 255, 255, 0.08);
  color: var(--white);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
  white-space: nowrap;
}

.icon-btn:hover {
  transform: translateY(-1px);
  background: rgba(255, 143, 184, 0.22);
  box-shadow: 0 0 18px rgba(255, 143, 184, 0.35);
}

.icon-btn.active {
  background: linear-gradient(135deg, rgba(255, 143, 184, 0.35), rgba(196, 167, 255, 0.35));
  border-color: var(--blush);
}

.mobile-menu-btn {
  display: none;
  background: rgba(255, 255, 255, 0.08);
  border: 2px solid rgba(255, 194, 226, 0.35);
  color: var(--white);
  border-radius: 999px;
  padding: 7px 12px;
  font-size: 0.9rem;
  cursor: pointer;
}

.mobile-drawer {
  display: none;
  position: fixed;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  width: min(92%, 420px);
  z-index: 49;
  padding: 16px;
  border-radius: var(--radius-md);
  background: rgba(20, 8, 43, 0.94);
  backdrop-filter: blur(18px);
  border: 2px solid rgba(255, 194, 226, 0.35);
  box-shadow: var(--glass-shadow);
  flex-direction: column;
  gap: 8px;
}

.mobile-drawer.open { display: flex; }

.mobile-drawer a {
  color: var(--white);
  text-decoration: none;
  padding: 10px 14px;
  border-radius: 12px;
  font-weight: 500;
  background: rgba(255, 255, 255, 0.04);
}

/* Main Content Layout */
main {
  position: relative;
  z-index: 2;
}

.section {
  position: relative;
  padding: 96px 20px;
  max-width: 1160px;
  margin: 0 auto;
}

.section-header {
  text-align: center;
  max-width: 720px;
  margin: 0 auto 44px;
}

.section-kicker {
  display: inline-block;
  font-size: 0.78rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  background: rgba(255, 212, 121, 0.12);
  border: 1px solid rgba(255, 212, 121, 0.3);
  padding: 5px 14px;
  border-radius: 999px;
  margin-bottom: 14px;
}

.section-title {
  font-family: var(--font-display);
  font-size: clamp(2.1rem, 4.5vw, 3.4rem);
  font-weight: 700;
  line-height: 1.12;
  margin: 0 0 12px;
  background: linear-gradient(135deg, #fff8ff 0%, #ffd479 48%, #ff8fb8 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.section-subtitle {
  color: var(--muted);
  font-size: 1.03rem;
  margin: 0;
}

.glass-card {
  background: var(--glass-bg);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 2px solid rgba(255, 194, 226, 0.35);
  border-radius: var(--radius-lg);
  box-shadow: var(--glass-shadow);
}

/* Buttons */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 28px;
  border-radius: 999px;
  border: none;
  background: linear-gradient(135deg, #ff7eb3 0%, #c471ed 55%, #ffd479 100%);
  color: #16072b;
  font-family: var(--font-sans);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 10px 28px rgba(255, 126, 179, 0.42);
  transition: transform 0.25s, box-shadow 0.25s, filter 0.25s;
}

.btn-primary:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 14px 36px rgba(255, 126, 179, 0.58);
  filter: brightness(1.06);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 22px;
  border-radius: 999px;
  border: 1px solid rgba(196, 167, 255, 0.38);
  background: rgba(255, 255, 255, 0.08);
  color: var(--white);
  font-family: var(--font-sans);
  font-size: 0.94rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s, border-color 0.2s;
}

.btn-secondary:hover {
  transform: translateY(-1px);
  background: rgba(196, 167, 255, 0.2);
  border-color: var(--lavender);
}

/* SECTION 1: HERO / CINEMATIC INTRO */
.hero-section {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 110px 20px 60px;
  max-width: 100%;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 212, 121, 0.35);
  color: var(--gold);
  font-size: 0.86rem;
  font-weight: 600;
  margin-bottom: 22px;
}

.hero-prelude {
  font-family: var(--font-display);
  font-style: italic;
  font-size: clamp(1.25rem, 2.8vw, 1.85rem);
  color: var(--lavender);
  max-width: 720px;
  margin: 0 auto 18px;
  text-shadow: 0 0 24px rgba(196, 167, 255, 0.45);
}

.hero-title {
  font-family: var(--font-display);
  font-size: clamp(2.8rem, 7.5vw, 5.6rem);
  font-weight: 700;
  line-height: 1.04;
  margin: 0 0 18px;
  letter-spacing: 0.02em;
  background: linear-gradient(135deg, #fff8ff 0%, #ff8fb8 45%, #ffd479 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 6px 28px rgba(255, 143, 184, 0.35));
}

.hero-sub {
  max-width: 600px;
  margin: 0 auto 30px;
  color: var(--muted);
  font-size: 1.06rem;
}

.hero-cta-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
}

/* SECTION 2: GIANT 20 CELEBRATION */
.celebration-card {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 36px;
  align-items: center;
  padding: 44px;
}

.giant-20-stage {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 280px;
}

.giant-20 {
  font-family: var(--font-display);
  font-size: clamp(7rem, 16vw, 11.5rem);
  font-weight: 800;
  line-height: 0.9;
  background: linear-gradient(160deg, #fff8ff 0%, #ffd479 38%, #ff8fb8 75%, #c4a7ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 36px rgba(255, 143, 184, 0.55));
  animation: pulse20 4s ease-in-out infinite;
  user-select: none;
}

@keyframes pulse20 {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-10px) scale(1.04); }
}

.orbit-ring {
  position: absolute;
  width: 240px;
  height: 240px;
  border-radius: 50%;
  border: 1.5px dashed rgba(255, 212, 121, 0.4);
  animation: spinSlow 18s linear infinite;
  pointer-events: none;
}

.orbit-ring span {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.4rem;
}

@keyframes spinSlow {
  to { transform: rotate(360deg); }
}

.celebration-copy h3 {
  font-family: var(--font-display);
  font-size: clamp(1.8rem, 3.2vw, 2.5rem);
  margin: 0 0 14px;
  color: var(--white);
}

.celebration-copy p {
  color: var(--muted);
  margin: 0 0 18px;
}

.milestone-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.pill {
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  background: rgba(255, 143, 184, 0.14);
  border: 1px solid rgba(255, 143, 184, 0.32);
  color: var(--white);
}

/* SECTION 3: MEMORY LANE */
.gallery-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 30px;
}

.filter-btn {
  padding: 9px 18px;
  border-radius: 999px;
  border: 2px solid rgba(255, 194, 226, 0.35);
  background: rgba(255, 255, 255, 0.06);
  color: var(--muted);
  font-weight: 600;
  font-size: 0.88rem;
  cursor: pointer;
  transition: all 0.2s;
}

.filter-btn.active, .filter-btn:hover {
  background: linear-gradient(135deg, rgba(255, 143, 184, 0.3), rgba(196, 167, 255, 0.3));
  color: var(--white);
  border-color: var(--blush);
}

.polaroid-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 26px;
}

.polaroid-card {
  background: #fff8ff;
  color: #201036;
  padding: 14px 14px 20px;
  border-radius: 12px;
  box-shadow: 0 18px 36px rgba(5, 1, 14, 0.55);
  cursor: pointer;
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s;
  transform: rotate(var(--tilt, -1.5deg));
}

.polaroid-card:nth-child(even) { --tilt: 1.5deg; }
.polaroid-card:nth-child(3n) { --tilt: -0.8deg; }

.polaroid-card:hover {
  transform: translateY(-8px) rotate(0deg) scale(1.03);
  box-shadow: 0 24px 48px rgba(255, 143, 184, 0.35);
}

.polaroid-img-wrap {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 8px;
  overflow: hidden;
  background: #1b0b36;
}

.polaroid-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.polaroid-caption {
  margin-top: 12px;
  text-align: center;
}

.polaroid-caption strong {
  display: block;
  font-family: var(--font-hand);
  font-size: 1.45rem;
  color: #2b124c;
  line-height: 1.15;
}

.polaroid-caption span {
  font-size: 0.78rem;
  color: #6d4c96;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* SECTION 4: PERSONAL LETTER & ENVELOPE */
.letter-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

.envelope-wrapper {
  position: relative;
  width: min(100%, 420px);
  height: 270px;
  cursor: pointer;
  perspective: 1000px;
}

.envelope-body {
  position: relative;
  width: 100%;
  height: 100%;
  background: linear-gradient(145deg, #3c1b66, #240d42);
  border: 1.5px solid rgba(255, 212, 121, 0.45);
  border-radius: 18px;
  box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: transform 0.3s;
}

.envelope-wrapper:hover .envelope-body { transform: translateY(-4px); }

.envelope-flap {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 55%;
  background: linear-gradient(160deg, #53268c, #2f1254);
  clip-path: polygon(0 0, 50% 85%, 100% 0);
  transform-origin: top;
  transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  z-index: 3;
}

.envelope-wrapper.opened .envelope-flap {
  transform: rotateX(180deg);
}

.wax-seal {
  position: relative;
  z-index: 4;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #ff9ec4, #d8437f);
  border: 2px solid #ffd479;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  box-shadow: 0 6px 20px rgba(255, 143, 184, 0.55);
  transition: transform 0.4s, opacity 0.4s;
}

.envelope-wrapper.opened .wax-seal {
  transform: scale(0.6);
  opacity: 0;
}

.envelope-label {
  margin-top: 14px;
  font-family: var(--font-display);
  font-size: 1.25rem;
  color: var(--gold);
  z-index: 2;
}

.letter-paper {
  display: none;
  width: min(100%, 720px);
  padding: 38px 36px;
  border-radius: 20px;
  background: linear-gradient(180deg, #fff9fc 0%, #f9eef7 100%);
  color: #24103e;
  box-shadow: 0 28px 60px rgba(5, 1, 16, 0.65);
  border: 2px solid rgba(255, 212, 121, 0.55);
  animation: unfoldLetter 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.letter-paper.visible { display: block; }

@keyframes unfoldLetter {
  from { opacity: 0; transform: translateY(24px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.letter-text {
  font-family: var(--font-hand);
  font-size: clamp(1.38rem, 2.5vw, 1.72rem);
  line-height: 1.55;
  white-space: pre-wrap;
  margin: 0 0 22px;
}

.letter-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: flex-end;
}

/* SECTION 5: BALLOON POPPING GAME */
.game-panel {
  padding: 28px;
}

.game-hud {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}

.hud-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.stat-chip {
  padding: 8px 16px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.08);
  border: 2px solid rgba(255, 194, 226, 0.35);
  font-size: 0.92rem;
  font-weight: 600;
}

.stat-chip strong { color: var(--gold); }

.balloon-arena {
  position: relative;
  width: 100%;
  height: 430px;
  border-radius: 18px;
  overflow: hidden;
  background: radial-gradient(circle at 50% 80%, rgba(196, 167, 255, 0.16), rgba(14, 5, 32, 0.85));
  border: 1px solid rgba(255, 255, 255, 0.14);
  touch-action: manipulation;
}

#balloon-game-canvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: crosshair;
}

.balloon-toast {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 20px;
  border-radius: 999px;
  background: rgba(255, 143, 184, 0.92);
  color: #18062e;
  font-weight: 700;
  font-size: 0.95rem;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
}

.balloon-toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }

.game-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  background: rgba(14, 5, 30, 0.78);
  backdrop-filter: blur(8px);
}

.game-overlay.hidden { display: none; }

/* SECTION 6: 3D CAKE & 20 CANDLES */
.cake-card {
  padding: 28px;
  text-align: center;
}

.cake-canvas-wrap {
  position: relative;
  width: 100%;
  height: 420px;
  border-radius: 18px;
  overflow: hidden;
  background: radial-gradient(circle at 50% 45%, rgba(255, 143, 184, 0.16), rgba(14, 5, 32, 0.88));
  border: 1px solid rgba(255, 255, 255, 0.14);
  margin-bottom: 20px;
}

#cake-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.cake-status-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 18px;
}

.wish-banner {
  display: none;
  margin: 18px auto 0;
  padding: 18px 24px;
  max-width: 680px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(255, 212, 121, 0.2), rgba(255, 143, 184, 0.22));
  border: 1px solid var(--gold);
  font-family: var(--font-display);
  font-size: clamp(1.3rem, 2.8vw, 1.85rem);
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.04em;
}

.wish-banner.show { display: block; animation: unfoldLetter 0.5s ease forwards; }

/* SECTION 7: QUIZ */
.quiz-card {
  max-width: 760px;
  margin: 0 auto;
  padding: 34px;
}

.quiz-progress-track {
  width: 100%;
  height: 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.1);
  overflow: hidden;
  margin-bottom: 24px;
}

.quiz-progress-fill {
  height: 100%;
  width: 20%;
  background: linear-gradient(90deg, var(--blush), var(--gold));
  transition: width 0.35s ease;
}

.quiz-question {
  font-family: var(--font-display);
  font-size: clamp(1.45rem, 2.8vw, 2rem);
  margin: 0 0 20px;
}

.quiz-options {
  display: grid;
  gap: 12px;
}

.quiz-opt-btn {
  text-align: left;
  padding: 14px 18px;
  border-radius: 14px;
  border: 2px solid rgba(255, 194, 226, 0.35);
  background: rgba(255, 255, 255, 0.06);
  color: var(--white);
  font-size: 0.98rem;
  font-weight: 500;
  cursor: pointer;
  transition: transform 0.18s, background 0.2s, border-color 0.2s;
}

.quiz-opt-btn:hover:not(:disabled) {
